name: Release images
on:
  push: {tags: ["v*"]}

permissions:
  contents: read
  packages: write
  id-token: write       # keyless cosign signing

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [api, canary-listener, generator, honeypot, ui]}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/deception-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          sbom: true
          provenance: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
