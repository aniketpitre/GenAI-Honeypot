name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [api, canary-listener, generator]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install -r services/api/requirements.txt
          pip install -r services/canary-listener/requirements.txt
          pip install -r services/generator/requirements.txt
      - run: python tests/e2e/run_e2e.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: services/ui/package-lock.json}
      - run: npm ci && npm run build
        working-directory: services/ui

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config is valid
        run: |
          cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/;s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=ci/;s/^INTERNAL_API_KEY=.*/INTERNAL_API_KEY=ci/' .env
          docker compose --profile honeypot --profile elk config --quiet
      - name: chart copies of pipeline/ are in sync
        run: make sync-chart && git diff --exit-code deploy/helm
      - uses: azure/setup-helm@v4
      - name: alert rules unit tests (promtool)
        run: ./tests/prometheus/run.sh
      - name: helm lint + schema-validate
        run: |
          ARGS="--set secrets.adminToken=a,secrets.internalApiKey=b,dev.postgres.enabled=true,dev.elk.enabled=true,dev.elk.password=ci-pass,monitoring.prometheusRule.enabled=true,monitoring.grafanaDashboard.enabled=true"
          helm lint deploy/helm/deception-platform $ARGS
          helm template t deploy/helm/deception-platform $ARGS > /tmp/render.yaml
          helm template t deploy/helm/deception-platform -f deploy/helm/deception-platform/values.production.yaml > /tmp/render-prod.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.30.0 /tmp/render.yaml /tmp/render-prod.yaml

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [api, canary-listener, generator, honeypot, ui]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with: {context: "services/${{ matrix.service }}", push: false}
