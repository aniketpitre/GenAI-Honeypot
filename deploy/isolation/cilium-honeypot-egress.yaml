# Optional (Cilium CNI): make the honeypot's egress explicit and observable. Anything else is
# denied and shows up in Hubble as a dropped flow - a useful "attacker tried to call out" signal.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: honeypot-egress, namespace: deception}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/component: honeypot}
  egress:
    - toEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s:k8s-app": kube-dns}
      toPorts: [{ports: [{port: "53", protocol: ANY}], rules: {dns: [{matchPattern: "*"}]}}]
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/component: api}
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/component: logstash}
      toPorts: [{ports: [{port: "5044", protocol: TCP}]}]
