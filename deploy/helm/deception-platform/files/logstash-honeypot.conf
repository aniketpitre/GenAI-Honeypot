input {
  beats { port => 5044 }
}

filter {
  if [fields][log_type] == "auth" {
    if [message] =~ "Failed password" {
      grok { match => { "message" => "^%{SYSLOGTIMESTAMP:ts} %{SYSLOGHOST} sshd(?:\[%{POSINT}\])?: Failed password for (?:invalid user )?%{DATA:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int}" } }
      mutate { add_field => { "[event][action]" => "ssh_login_failed" "[event][outcome]" => "failure" } }
    } else if [message] =~ "Accepted" {
      grok { match => { "message" => "^%{SYSLOGTIMESTAMP:ts} %{SYSLOGHOST} sshd(?:\[%{POSINT}\])?: Accepted %{WORD} for %{DATA:[user][name]} from %{IP:[source][ip]} port %{INT:[source][port]:int}" } }
      mutate { add_field => { "[event][action]" => "ssh_login_success" "[event][outcome]" => "success" } }
    } else if [message] =~ "Invalid user" {
      grok { match => { "message" => "^%{SYSLOGTIMESTAMP:ts} %{SYSLOGHOST} sshd(?:\[%{POSINT}\])?: Invalid user %{DATA:[user][name]} from %{IP:[source][ip]}" } }
      mutate { add_field => { "[event][action]" => "ssh_invalid_user" "[event][outcome]" => "failure" } }
    } else {
      drop {}   # connection housekeeping noise
    }
    mutate { add_field => {
      "[event][kind]" => "event" "[event][category]" => "authentication"
      "[event][dataset]" => "deception.ssh" "[deception][sensor]" => "honeypot-ssh" } }
    date { match => ["ts", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] timezone => "UTC" }
  } else if [fields][log_type] == "nginx_access" {
    grok { match => { "message" => '^%{IPORHOST:[source][ip]} - %{DATA} \[%{HTTPDATE:ts}\] "%{WORD:[http][request][method]} %{DATA:[url][path]} HTTP/%{NUMBER}" %{INT:[http][response][status_code]:int} %{INT} "%{DATA}" "%{DATA:[user_agent][original]}"' } }
    mutate { add_field => {
      "[event][kind]" => "event" "[event][category]" => "web" "[event][action]" => "http_request"
      "[event][dataset]" => "deception.nginx" "[deception][sensor]" => "honeypot-web" } }
    date { match => ["ts", "dd/MMM/yyyy:HH:mm:ss Z"] }
  } else {
    drop {}
  }

  if [source][ip] {
    geoip { source => "[source][ip]" target => "[source][geo]" }
  }
  mutate { remove_field => ["ts", "agent", "ecs", "input", "log", "fields", "host", "tags"] }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "deception-events-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
