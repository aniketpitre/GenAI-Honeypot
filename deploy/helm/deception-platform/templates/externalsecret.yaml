{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dp.fullname" . }}
  labels: {{- include "dp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "dp.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key, $ref := .Values.externalSecrets.remoteRefs }}
    - secretKey: {{ $key }}
      remoteRef: {key: {{ $ref | quote }}}
    {{- end }}
{{- end }}
