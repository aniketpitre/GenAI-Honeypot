{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dp.secretName" . }}
  labels: {{- include "dp.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_TOKEN: {{ required "secrets.adminToken (or secrets.existingSecret) is required" .Values.secrets.adminToken | quote }}
  INTERNAL_API_KEY: {{ required "secrets.internalApiKey (or secrets.existingSecret) is required" .Values.secrets.internalApiKey | quote }}
  DATABASE_URL: {{ if .Values.dev.postgres.enabled }}{{ printf "postgresql+psycopg://deception:deception@%s-postgres:5432/deception" (include "dp.fullname" .) | quote }}{{ else }}{{ required "secrets.databaseUrl is required unless dev.postgres.enabled" .Values.secrets.databaseUrl | quote }}{{ end }}
  {{- if .Values.dev.elk.enabled }}
  ELASTICSEARCH_USER: deception_writer
  ELASTICSEARCH_PASSWORD: {{ required "dev.elk.password is required when dev.elk.enabled" .Values.dev.elk.password | quote }}
  {{- else }}
  ELASTICSEARCH_USER: {{ .Values.secrets.elasticsearchUser | quote }}
  ELASTICSEARCH_PASSWORD: {{ .Values.secrets.elasticsearchPassword | quote }}
  ELASTICSEARCH_API_KEY: {{ .Values.secrets.elasticsearchApiKey | quote }}
  {{- end }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  WEBHOOK_URL: {{ .Values.secrets.webhookUrl | quote }}
{{- end }}
