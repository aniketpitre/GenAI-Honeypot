module(load="imuxsock")
# Classic "Oct 12 03:14:07 host sshd[123]: ..." lines: what attackers expect to read
# and what the Logstash grok patterns parse.
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
# Real sshd events: appended to the decoy /var/log/auth.log (so what the
# attacker reads stays consistent) and to the file the log shipper tails.
auth,authpriv.* /var/log/auth.log
auth,authpriv.* /var/log/honeypot/auth.log
